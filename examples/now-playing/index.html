<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Now Playing</title>
  <link rel="stylesheet" href="/_carpwa/carpwa.css">
  <link rel="stylesheet" href="style.css">
  <script src="/_carpwa/sdk.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l12-7.2a1 1 0 0 0 0-1.72l-12-7.2A1 1 0 0 0 7 4.8z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5.5" y="4.5" width="4.6" height="15" rx="1.3"/><rect x="13.9" y="4.5" width="4.6" height="15" rx="1.3"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M2.5 6.6v10.8a.8.8 0 0 0 1.27.65L11 12.65a.8.8 0 0 0 0-1.3L3.77 5.95a.8.8 0 0 0-1.27.65zM12.5 6.6v10.8a.8.8 0 0 0 1.27.65L21 12.65a.8.8 0 0 0 0-1.3l-7.23-5.4a.8.8 0 0 0-1.27.65z"/></symbol>
    <symbol id="i-back15" viewBox="0 0 24 24">
      <path d="M12 4.6a8.2 8.2 0 1 1-7.1 4.1" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      <path d="M8.2 4.6 12.6 1.6v6z"/>
      <text x="12" y="16.3" text-anchor="middle" font-size="7.6" font-weight="700" font-family="-apple-system, system-ui, sans-serif">15</text>
    </symbol>
    <symbol id="i-fwd15" viewBox="0 0 24 24">
      <g transform="matrix(-1 0 0 1 24 0)">
        <path d="M12 4.6a8.2 8.2 0 1 1-7.1 4.1" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        <path d="M8.2 4.6 12.6 1.6v6z"/>
      </g>
      <text x="12" y="16.3" text-anchor="middle" font-size="7.6" font-weight="700" font-family="-apple-system, system-ui, sans-serif">15</text>
    </symbol>
    <symbol id="i-note" viewBox="0 0 24 24">
      <path d="M8.6 6.2 20.4 3.6v3.2L8.6 9.4z"/>
      <rect x="8.6" y="6.4" width="1.7" height="11.4" rx=".6"/>
      <rect x="18.7" y="3.8" width="1.7" height="11.4" rx=".6"/>
      <ellipse cx="6.9" cy="17.7" rx="3.2" ry="2.5" transform="rotate(-20 6.9 17.7)"/>
      <ellipse cx="17" cy="15.1" rx="3.2" ry="2.5" transform="rotate(-20 17 15.1)"/>
    </symbol>
  </svg>

  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>

  <main class="player" id="player" data-state="empty">
    <section class="now" aria-label="Now playing">
      <div class="art" id="art-box">
        <svg class="art-placeholder" aria-hidden="true"><use href="#i-note"/></svg>
        <img id="art" alt="">
      </div>

      <div class="meta">
        <p class="source" id="source"></p>
        <h1 class="title" id="title"></h1>
        <p class="artist" id="artist"></p>
        <p class="album" id="album"></p>

        <div class="progress" id="progress">
          <div class="track"><div class="fill" id="fill"></div></div>
          <div class="times"><span id="elapsed">0:00</span><span id="remaining">-0:00</span></div>
        </div>

        <div class="transport">
          <button class="ctl" id="back15" aria-label="Back 15 seconds"><svg><use href="#i-back15"/></svg></button>
          <button class="ctl" id="prev" aria-label="Previous track"><svg class="flip"><use href="#i-next"/></svg></button>
          <button class="ctl play" id="play" aria-label="Play">
            <svg class="when-paused"><use href="#i-play"/></svg>
            <svg class="when-playing"><use href="#i-pause"/></svg>
          </button>
          <button class="ctl" id="next" aria-label="Next track"><svg><use href="#i-next"/></svg></button>
          <button class="ctl" id="fwd15" aria-label="Forward 15 seconds"><svg><use href="#i-fwd15"/></svg></button>
        </div>
      </div>
    </section>

    <section class="empty" aria-live="polite">
      <svg class="empty-icon" aria-hidden="true"><use href="#i-note"/></svg>
      <h1 class="empty-title" id="empty-title">Connecting…</h1>
      <p class="empty-note" id="empty-note"></p>
      <button class="cp-button cp-primary" id="resume" hidden>Play</button>
    </section>

    <p class="toast" id="toast" role="status"></p>
  </main>
</body>
</html>
