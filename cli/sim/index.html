<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>CarPWA Simulator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffb341'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23181208' stroke-width='3'/%3E%3Cpath d='M16 17.5L8.5 15M16 17.5l7.5-2.5M16 17.5V25' stroke='%23181208' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="sim.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#ffb341"/><circle cx="16" cy="16" r="9" fill="none" stroke="#181208" stroke-width="3"/><path d="M16 17.5L8.5 15M16 17.5l7.5-2.5M16 17.5V25" stroke="#181208" stroke-width="3" stroke-linecap="round"/></svg>
      <span>CarPWA</span><em>Simulator</em>
    </div>

    <div class="app-chip" id="app-chip" title="App">
      <img id="app-icon" alt="">
      <div class="app-chip-text">
        <strong id="app-name">Loading…</strong>
        <small id="app-id"></small>
      </div>
      <span class="pill" id="app-status"></span>
    </div>

    <div class="status-chips" id="status-chips" aria-live="polite"></div>

    <div class="tools">
      <select id="screen-select" title="Display"></select>
      <select id="zoom-select" title="Zoom">
        <option value="fit">Fit</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
      </select>
      <button class="tool-btn" id="reload-btn" title="Reload app (R)"></button>
      <a class="tool-btn" id="open-btn" target="_blank" rel="noopener" title="Open the app alone in a new tab (browser mode)"></a>
      <button class="tool-btn on" id="panel-btn" title="Toggle inspector (I)"></button>
    </div>
  </header>

  <main class="layout" id="layout">
    <div class="stage" id="stage"></div>
    <aside class="inspector" id="inspector" aria-label="Inspector"></aside>
  </main>

  <div class="offline" id="offline" role="status">Simulator server stopped. Waiting for <code>carpwa sim</code> to come back…</div>
  <noscript><p class="noscript">The CarPWA simulator needs JavaScript.</p></noscript>
</body>
</html>
